name: Daily Data Collection

on:
  schedule:
    # Runs at 3 AM EST every day
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv sqlalchemy pandas

      - name: Download existing database
        continue-on-error: true
        run: |
          mkdir -p data
          # Download database artifact from previous run if exists
          gh run download --name yankees-db --dir data || echo "No previous database found"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect odds data
        run: python -c "from data_collection.odds import main; main()"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          DATABASE_PATH: data/yankees_sentiment.db

      - name: Collect news data
        run: python -c "from data_collection.news import main; main()"
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          DATABASE_PATH: data/yankees_sentiment.db

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: yankees-db
          path: data/yankees_sentiment.db
          retention-days: 90